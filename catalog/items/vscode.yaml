id: vscode
category: editors
name: "VS Code"
description: {en: "Visual Studio Code", pt-BR: "Visual Studio Code"}
platforms: [macos, linux]
requires: {graphical: true}
notes: {en: "On Linux this adds the Microsoft package repository (apt or dnf).", pt-BR: "No Linux, isto adiciona o repositório de pacotes da Microsoft (apt ou dnf)."}
detect:
  command: "command -v code >/dev/null 2>&1 || [ -d \"/Applications/Visual Studio Code.app\" ]"
install:
  - backend: brew
    package: cask:visual-studio-code
    when: {os: macos}
  - backend: script
    inline: "sudo install -d -m 0755 /etc/apt/keyrings && curl -fsSL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor | sudo tee /etc/apt/keyrings/packages.microsoft.gpg >/dev/null && echo \"deb [signed-by=/etc/apt/keyrings/packages.microsoft.gpg] https://packages.microsoft.com/repos/code stable main\" | sudo tee /etc/apt/sources.list.d/vscode.list >/dev/null && sudo apt-get update && sudo apt-get install -y code"
    when: {os: linux, pkg_manager: apt}
    needs_sudo: true
  - backend: script
    inline: "sudo rpm --import https://packages.microsoft.com/keys/microsoft.asc && printf '[code]\\nname=Visual Studio Code\\nbaseurl=https://packages.microsoft.com/yumrepos/vscode\\nenabled=1\\ngpgcheck=1\\ngpgkey=https://packages.microsoft.com/keys/microsoft.asc\\n' | sudo tee /etc/yum.repos.d/vscode.repo >/dev/null && sudo dnf install -y code"
    when: {os: linux, pkg_manager: dnf}
    needs_sudo: true
