id: procs
category: replacements
name: "procs"
description: {en: "Readable process list (ps)", pt-BR: "Lista de processos legível (ps)"}
homepage: https://github.com/dalance/procs
platforms: [macos, linux]
detect:
  command: "procs --version"
  version_regex: "([\\d]+\\.[\\d]+(?:\\.[\\d]+)?)"
install:
  - backend: brew
    package: procs
    when: {os: macos}
  - backend: mise
    package: aqua:dalance/procs
    when: {os: linux, arch: amd64}
  - backend: system
    package: dnf=procs,pacman=procs
