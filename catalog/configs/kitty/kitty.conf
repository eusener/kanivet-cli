# kitty — config opinativa do kanivet-cli (gerada; um backup do arquivo anterior foi salvo)
# Docs: https://sw.kovidgoyal.net/kitty/conf/

font_family      family="JetBrainsMono Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 14.0
disable_ligatures never

tab_bar_edge top
tab_bar_style separator
tab_separator " "
tab_title_template " {index}: {title} "
tab_bar_margin_height 8 8

background_opacity 0.85
background_blur 48

# Ícones dos agentes de IA (fonte instalada pelo item herdr-icon-font)
symbol_map U+E1A0-U+E1BA Herdr Agent Icons Max
symbol_map U+E1C0-U+E1C5 Herdr Agent Icons Max

# macOS
macos_titlebar_color background
macos_option_as_alt left
macos_show_window_title_in window

# Abas, janelas e janelas do sistema novas abrem no diretório atual
map cmd+t             new_tab_with_cwd
map ctrl+shift+t      new_tab_with_cwd
map cmd+enter         new_window_with_cwd
map ctrl+shift+enter  new_window_with_cwd
map cmd+n             new_os_window_with_cwd
map ctrl+shift+n      new_os_window_with_cwd
